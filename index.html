<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>잔액 관리 가계부</title>
<meta name="theme-color" content="#1F2A44" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="잔액 관리 가계부" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="icon" href="./icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  :root {
    --paper: #F7F4EC; --paper-line: #E2DAC4; --ink: #1F2A44; --ink-soft: #6B7280;
    --red-ink: #A8342F; --green-ink: #2F6B4F; --stamp: #C08A2E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink);
    font-family: 'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif; min-height: 100%; }
  body {
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 27px, var(--paper-line) 27px, var(--paper-line) 28px);
    padding: 20px 16px 48px; max-width: 480px; margin: 0 auto;
  }
  h1, h2 { margin: 0; }
  .hidden { display: none !important; }

  /* ---------- 로그인 화면 ---------- */
  #loginScreen, #loadingScreen { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
  .splash-logo { width: 88px; height: 88px; border-radius: 20px; object-fit: cover; margin-bottom: 16px; border: 1px solid var(--paper-line); }
  .splash-tagline { font-family: 'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif; font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .login-title { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 28px; margin-bottom: 8px; }
  .login-sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 32px; }
  .login-google-btn {
    display: flex; align-items: center; gap: 10px; padding: 12px 22px; border: 1px solid var(--ink);
    background: #fff; color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 16px;
  }
  .login-guest-link { background: none; border: none; color: var(--ink-soft); font-size: 12px; text-decoration: underline; cursor: pointer; }
  .login-error { font-size: 14px; color: var(--red-ink); margin-top: 14px; max-width: 280px; }

  /* ---------- 헤더 / 계정 ---------- */
  .lg-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); position: relative; }
  .lg-title { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; }
  .lg-account-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; padding: 0; font-size: 14px; font-weight: 700; }
  .lg-account-btn img { width: 100%; height: 100%; object-fit: cover; }
  .lg-account-panel {
    position: absolute; top: 42px; right: 0; background: #fff; border: 1px solid var(--ink);
    padding: 14px; width: 210px; z-index: 20; display: none; box-shadow: 2px 2px 0 rgba(31,42,68,0.15);
  }
  .lg-account-panel.show { display: block; }
  .lg-account-name { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
  .lg-account-email { font-size: 11px; color: var(--ink-soft); margin-bottom: 12px; word-break: break-all; }
  .lg-account-mode { font-size: 11px; color: var(--ink-soft); margin-bottom: 12px; }
  .lg-logout-btn, .lg-login-inline-btn { width: 100%; padding: 8px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); font-size: 12px; font-weight: 700; cursor: pointer; }
  .lg-sync-note { font-size: 11px; color: var(--ink-soft); text-align: right; margin-bottom: 14px; min-height: 14px; }

  /* ---------- 상단 액션(저장/실행취소) ---------- */
  .lg-action-row { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .lg-save-small-btn { padding: 5px 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-weight: 700; font-size: 11px; cursor: pointer; }

  .lg-total-panel { border: 1px solid var(--ink); background: rgba(247,244,236,0.6); padding: 16px; margin-bottom: 18px; text-align: center; }
  .lg-total-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .lg-total-value { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 26px; }
  .lg-total-value.negative { color: var(--red-ink); }

  /* ---------- 탭 ---------- */
  .lg-tabbar { display: flex; border: 1px solid var(--ink); margin-bottom: 16px; }
  .lg-tab-btn { flex: 1; padding: 10px; background: transparent; border: none; font-size: 13px; font-weight: 700; color: var(--ink-soft); cursor: pointer; }
  .lg-tab-btn.active { background: var(--ink); color: var(--paper); }
  .lg-tab-panel { display: none; }
  .lg-tab-panel.active { display: block; }

  .lg-quick-panel { margin-bottom: 16px; }
  .lg-quick-row { display: flex; gap: 8px; }
  .lg-quick-input { flex: 1; padding: 10px 11px; border: 1px solid var(--ink); background: #fff; font-size: 14px; font-family: inherit; color: var(--ink); min-width: 0; box-sizing: border-box; }
  .lg-quick-btn { padding: 10px 16px; border: none; background: var(--stamp); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .lg-quick-hint { font-size: 11px; color: var(--ink-soft); margin-top: 5px; }
  .lg-error { font-size: 14px; color: var(--red-ink); margin-top: 6px; }

  .lg-items-manage { margin-bottom: 16px; }
  .lg-manage-toggle { width: 100%; padding: 9px 12px; background: #fff; border: 1px solid var(--paper-line); color: var(--ink-soft); font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
  .lg-manage-chevron { display: inline-block; transition: transform 0.2s ease; font-size: 20px; line-height: 1; }
  .lg-manage-chevron.open { transform: rotate(180deg); }
  .lg-manage-body { display: none; border: 1px solid var(--ink); border-top: none; padding: 12px 14px; background: rgba(247,244,236,0.6); }
  .lg-manage-body.show { display: block; }
  .lg-manage-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--paper-line); font-size: 13px; }
  .lg-manage-row .lg-item-dot { margin-right: 6px; }
  .lg-manage-row-btns { display: flex; gap: 10px; }
  .lg-manage-edit { background: none; border: none; color: var(--stamp); font-size: 12px; cursor: pointer; text-decoration: underline; }
  .lg-manage-del { background: none; border: none; color: var(--red-ink); font-size: 12px; cursor: pointer; text-decoration: underline; }
  .lg-manage-row-edit { gap: 6px; }
  .lg-manage-rename-input { flex: 1; padding: 6px 8px; border: 1px solid var(--ink); font-size: 13px; font-family: inherit; }
  .lg-manage-save { border: none; background: var(--ink); color: var(--paper); font-size: 12px; padding: 6px 10px; cursor: pointer; }
  .lg-add-item-row { display: flex; gap: 6px; margin-top: 10px; }
  .lg-add-item-row input { padding: 7px 9px; border: 1px solid var(--paper-line); font-size: 13px; min-width: 0; box-sizing: border-box; }
  .lg-add-item-row input.lg-item-name-input { flex: 1.4; }
  .lg-add-item-row input.lg-item-bal-input { flex: 1; }
  .lg-add-item-row button { padding: 7px 12px; border: none; background: var(--ink); color: var(--paper); font-size: 12px; cursor: pointer; flex-shrink: 0; }

  .lg-item-card { border: 1px solid var(--ink); margin-bottom: 10px; background: rgba(247,244,236,0.5); }
  .lg-item-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; cursor: pointer; }
  .lg-item-name-row { display: flex; align-items: center; gap: 8px; }
  .lg-item-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .lg-item-name { font-weight: 700; font-size: 14px; }
  .lg-item-balance { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 16px; }
  .lg-item-balance.negative { color: var(--red-ink); }
  .lg-item-body { padding: 0 14px 14px; border-top: 1px solid var(--paper-line); display: none; }
  .lg-item-card.open .lg-item-body { display: block; }

  .lg-edit-tx { background: none; border: none; color: var(--stamp); font-size: 11px; cursor: pointer; text-decoration: underline; padding: 0 2px; }
  .lg-tx-edit-row { flex-direction: column; align-items: stretch; gap: 6px; }
  .lg-tx-edit-fields { display: flex; gap: 6px; }
  .lg-tx-edit-fields input { flex: 1; padding: 6px 7px; border: 1px solid var(--ink); font-size: 12px; font-family: inherit; min-width: 0; }
  .lg-tx-edit-btns { display: flex; gap: 6px; }
  .lg-tx-edit-btns button { flex: 1; padding: 6px; border: none; background: var(--ink); color: var(--paper); font-size: 12px; cursor: pointer; }
  .lg-tx-edit-btns button.cancel { background: var(--ink-soft); }

  .lg-tx-form { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 14px; }
  .lg-type-switch { display: flex; border: 1px solid var(--ink); }
  .lg-type-btn { flex: 1; padding: 7px; background: transparent; border: none; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--ink-soft); }
  .lg-type-btn.active.out { background: var(--red-ink); color: var(--paper); }
  .lg-type-btn.active.in { background: var(--green-ink); color: var(--paper); }
  .lg-tx-form input { padding: 8px 9px; border: 1px solid var(--paper-line); background: #fff; font-size: 13px; font-family: inherit; color: var(--ink); }
  .lg-tx-form .lg-row { display: flex; gap: 8px; }
  .lg-tx-form .lg-row input { flex: 1; }
  .lg-tx-btn-row { display: flex; gap: 8px; }
  .lg-tx-submit { flex: 2; padding: 9px; border: none; background: var(--stamp); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
  .lg-tx-cancel { flex: 1; padding: 9px; border: 1px solid var(--paper-line); background: #fff; color: var(--ink-soft); font-weight: 700; font-size: 12px; cursor: pointer; }

  .lg-history-label { font-size: 12px; color: var(--ink-soft); font-weight: 700; margin: 4px 0 6px; }
  .lg-month-group { margin-bottom: 10px; }
  .lg-month-header { font-size: 11px; color: var(--ink-soft); font-weight: 700; background: var(--paper-line); padding: 4px 6px; margin-bottom: 4px; }
  .lg-tx-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--paper-line); font-size: 13px; gap: 8px; }
  .lg-tx-left { display: flex; flex-direction: column; min-width: 0; }
  .lg-tx-date { font-size: 11px; color: var(--ink-soft); }
  .lg-tx-memo { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lg-tx-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .lg-tx-amount { font-weight: 700; }
  .lg-tx-amount.in { color: var(--green-ink); }
  .lg-tx-amount.out { color: var(--red-ink); }
  .lg-tx-amount.adjust { color: var(--ink-soft); }
  .lg-delete { background: none; border: none; color: var(--ink-soft); font-size: 15px; cursor: pointer; padding: 2px 4px; line-height: 1; }
  .lg-empty-tx { font-size: 12px; color: var(--ink-soft); padding: 8px 0; }

  .lg-panel { border: 1px solid var(--ink); background: rgba(247,244,236,0.6); padding: 14px 16px; margin-bottom: 16px; }
  .lg-section-title { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 15px; margin-bottom: 10px; }
  .lg-hist-month-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .lg-hist-nav-btn { background: none; border: none; color: var(--ink); font-size: 18px; cursor: pointer; padding: 2px 6px; line-height: 1; }
  .lg-hist-nav-btn:disabled { color: var(--paper-line); cursor: default; }
  .lg-hist-month-label { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 14px; min-width: 88px; text-align: center; }
  .lg-hist-all-btn { margin-left: auto; padding: 5px 10px; border: 1px solid var(--paper-line); background: #fff; color: var(--ink-soft); font-size: 11px; cursor: pointer; }
  .lg-hist-all-btn.active { background: var(--stamp); color: #fff; border-color: var(--stamp); font-weight: 700; }
  .lg-item-month-nav { margin-top: 10px; }
  .lg-summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .lg-stamp { text-align: center; padding: 6px 2px; }
  .lg-stamp-label { font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  .lg-stamp-value { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 15px; word-break: keep-all; }
  .lg-stamp-value.income { color: var(--green-ink); }
  .lg-stamp-value.expense { color: var(--red-ink); }
  .lg-empty { text-align: center; padding: 20px 12px; color: var(--ink-soft); font-size: 13px; border: 1px dashed var(--paper-line); }

  .lg-ratio-chart { display: flex; align-items: center; gap: 14px; padding: 8px 4px 12px; flex-wrap: wrap; }
  .lg-ratio-donut { width: 60px; height: 60px; border-radius: 50%; flex-shrink: 0; position: relative; }
  .lg-ratio-donut::after { content: ""; position: absolute; inset: 10px; background: var(--paper); border-radius: 50%; }
  .lg-ratio-legend { display: flex; flex-direction: row; flex-wrap: wrap; gap: 6px 10px; font-size: 11px; flex: 1; min-width: 0; }
  .lg-ratio-legend-row { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .lg-ratio-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .lg-ratio-pct { font-weight: 700; }
  .lg-donut-svg { width: 100%; max-width: 320px; height: auto; display: block; margin: 0 auto; }
  .lg-sub-title { margin-top: 8px; font-size: 13px; }

  .lg-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
  .lg-table th { text-align: left; font-weight: 700; color: var(--ink-soft); border-bottom: 1px solid var(--ink); padding: 6px 4px; font-size: 11px; white-space: nowrap; }
  .lg-table td { padding: 7px 4px; border-bottom: 1px solid var(--paper-line); vertical-align: middle; }
  .lg-table-tag { color: #fff; font-size: 10px; padding: 2px 6px; white-space: nowrap; }
  .lg-table-amount { font-weight: 700; white-space: nowrap; }
  .lg-table-amount.in { color: var(--green-ink); }
  .lg-table-amount.out { color: var(--red-ink); }
  .lg-table-memo { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lg-table col.col-date { width: 15%; }
  .lg-table col.col-item { width: 24%; }
  .lg-table col.col-type { width: 14%; }
  .lg-table col.col-amount { width: 24%; }
  .lg-table col.col-memo { width: 23%; }

  .lg-install-banner { display: none; border: 1px solid var(--stamp); background: #fff8ea; padding: 10px 12px; font-size: 12px; color: var(--ink); margin-bottom: 16px; align-items: center; justify-content: space-between; gap: 8px; }
  .lg-install-banner.show { display: flex; }
  .lg-install-banner button { border: none; background: var(--stamp); color: #fff; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }

  .lg-exit-toast {
    display: none; position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 10px 18px; font-size: 13px;
    white-space: nowrap; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .lg-exit-toast.show { display: block; }
</style>
</head>
<body>

  <div id="installBanner" class="lg-install-banner">
    <span>홈 화면에 앱으로 추가할 수 있어요</span>
    <button id="installBtn">추가</button>
  </div>

  <!-- 스플래시 화면 -->
  <div id="loadingScreen">
    <img src="./icon-512.png" class="splash-logo" alt="잔액 관리 가계부" />
    <div class="login-title">잔액 관리 가계부</div>
    <div class="splash-tagline">제약 없는 삶!</div>
  </div>

  <!-- 로그인 화면 -->
  <div id="loginScreen" class="hidden">
    <div class="login-title">잔액 관리 가계부</div>
    <button class="login-google-btn" id="loginBtnMain">구글로 로그인</button>
    <button class="login-guest-link" id="guestBtn">로그인 없이 이 기기에서만 사용하기</button>
    <div id="loginError" class="login-error"></div>
  </div>

  <!-- 뒤로가기 두 번 눌러 종료 -->
  <div id="exitToast" class="lg-exit-toast">'뒤로가기'를 한 번 더 누르시면 종료됩니다</div>

  <!-- 메인 화면 -->
  <div id="appScreen" class="hidden">
    <div class="lg-header">
      <div class="lg-title">잔액 관리 가계부</div>
      <button class="lg-account-btn" id="accountBtn">＋</button>
      <div class="lg-account-panel" id="accountPanel">
        <div class="lg-account-name" id="accountName"></div>
        <div class="lg-account-email" id="accountEmail"></div>
        <div class="lg-account-mode" id="accountMode"></div>
        <button class="lg-logout-btn hidden" id="logoutBtn">로그아웃</button>
        <button class="lg-login-inline-btn hidden" id="loginBtnInline">구글로 로그인</button>
      </div>
    </div>
    <div id="syncNote" class="lg-sync-note"></div>

    <div class="lg-action-row">
      <button class="lg-save-small-btn" id="saveBtn">저장</button>
    </div>

    <div class="lg-total-panel">
      <div class="lg-total-label">전체 잔액</div>
      <div id="totalValue" class="lg-total-value">0원</div>
    </div>

    <div class="lg-tabbar">
      <button class="lg-tab-btn active" id="tabBtnItems" data-tab="items">항목</button>
      <button class="lg-tab-btn" id="tabBtnHistory" data-tab="history">전체 내역</button>
    </div>

    <div class="lg-tab-panel active" id="tabPanelItems">
      <div class="lg-quick-panel">
        <div class="lg-quick-row">
          <input type="text" id="quickInput" class="lg-quick-input" placeholder="입력: 내용 금액 분류" />
          <button id="quickBtn" class="lg-quick-btn">추가</button>
        </div>
        <div id="quickError" class="lg-error hidden"></div>
      </div>

      <div class="lg-items-manage">
        <button class="lg-manage-toggle" id="manageToggle"><span>항목 관리 (추가 / 삭제)</span><span class="lg-manage-chevron" id="manageChevron">▾</span></button>
        <div class="lg-manage-body" id="manageBody">
          <div id="manageList"></div>
          <div class="lg-add-item-row">
            <input type="text" id="newItemName" class="lg-item-name-input" placeholder="새 항목 이름" />
            <input type="number" id="newItemBalance" class="lg-item-bal-input" placeholder="시작 잔액(0)" />
            <button id="addItemBtn">추가</button>
          </div>
        </div>
      </div>

      <div id="itemList"></div>
    </div>

    <div class="lg-tab-panel" id="tabPanelHistory">
      <div class="lg-panel">
        <div class="lg-hist-month-nav">
          <button id="histPrevMonth" class="lg-hist-nav-btn">‹</button>
          <span id="histMonthLabel" class="lg-hist-month-label">전체</span>
          <button id="histNextMonth" class="lg-hist-nav-btn">›</button>
          <button id="histAllToggle" class="lg-hist-all-btn">전체보기</button>
        </div>
        <div class="lg-section-title" id="histSectionTitle">전체 내역</div>
        <div class="lg-summary-grid">
          <div class="lg-stamp"><div class="lg-stamp-label">총 입금</div><div id="totalIn" class="lg-stamp-value income">0원</div></div>
          <div class="lg-stamp"><div class="lg-stamp-label">총 출금</div><div id="totalOut" class="lg-stamp-value expense">0원</div></div>
          <div class="lg-stamp"><div class="lg-stamp-label">순변동</div><div id="netChange" class="lg-stamp-value">0원</div></div>
        </div>
        <div id="ratioChart" class="lg-ratio-chart"></div>
        <div class="lg-section-title lg-sub-title" id="incomeByItemTitle">입금 내역</div>
        <div id="incomeByItemChart" class="lg-ratio-chart"></div>
        <div class="lg-section-title lg-sub-title" id="expenseByItemTitle">출금 내역</div>
        <div id="expenseByItemChart" class="lg-ratio-chart"></div>
        <div id="allHistory"></div>
      </div>
    </div>
  </div>

<script type="module">
  // ===================== 뒤로가기 두 번 눌러 종료 =====================
  function armExitGuard() {
    history.pushState({ lgExitGuard: true }, "", location.href);
  }

  let exitPrimed = false;
  let exitPrimedTimer = null;

  function setupExitGuard() {
    armExitGuard();
    armExitGuard();
    window.addEventListener("popstate", () => {
      if (exitPrimed) {
        exitPrimed = false;
        clearTimeout(exitPrimedTimer);
        document.getElementById("exitToast").classList.remove("show");
        return;
      }
      exitPrimed = true;
      armExitGuard();
      document.getElementById("exitToast").classList.add("show");
      exitPrimedTimer = setTimeout(() => {
        exitPrimed = false;

  const PALETTE = ["#C08A2E","#2F6B4F","#3A4E8C","#52616B","#6B4E71","#2E7D82","#A8562E","#8C3A4E","#4E6B3A","#8A7C52"];

  function makeId() { return (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2)); }
  function todayISO() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
  function formatWon(n) { const sign = n < 0 ? "-" : ""; return sign + Math.abs(Math.round(n)).toLocaleString("ko-KR") + "원"; }
  function formatPct(num) {
    const rounded = Math.round(num * 10) / 10;
    return (rounded % 1 === 0 ? rounded.toFixed(0) : rounded.toFixed(1)) + "%";
  }
  function formatDateLabel(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const weekdays = ["일","월","화","수","목","금","토"];
    return (d.getMonth()+1) + "." + d.getDate() + " (" + weekdays[d.getDay()] + ")";
  }
  function formatMonthLabel(mk) { const [y,m] = mk.split("-").map(Number); return y + "년 " + m + "월"; }
  function shiftMonth(mk, delta) {
    const [y, m] = mk.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }
  function esc(s) { const div = document.createElement("div"); div.textContent = s == null ? "" : s; return div.innerHTML; }

  function getItem(name) { return state.items.find((i) => i.name === name); }
  function currentBalance(name) {
    const it = getItem(name);
    if (!it) return 0;
    let bal = it.initialBalance || 0;
    for (const t of state.transactions) {
      if (t.item !== name) continue;
      bal += t.type === "in" ? t.amount : t.type === "out" ? -t.amount : t.amount;
    }
    return bal;
  }

  function ensureItem(name) {
    if (getItem(name)) return;
    const color = PALETTE[state.items.length % PALETTE.length];
    state.items.push({ name, initialBalance: 0, color });
  }

  function addTransaction(item, type, amount, memo, date) {
    ensureItem(item);
    const tx = { id: makeId(), item, type, amount, memo: (memo || "").trim().slice(0, 20), date: date || todayISO(), createdAt: Date.now() };
    state.transactions.push(tx);

  }

  function deleteTransaction(id) {

  function editTransaction(id, newDate, newAmount, newMemo, newType) {

    tx.date = newDate || tx.date;

  function addItem(name, startBalance) {

  function removeItem(name) {

  function renameItem(oldName, newName) {

  function handleQuickAdd() {
    const input = document.getElementById("quickInput");
    const errBox = document.getElementById("quickError");
    const raw = input.value.trim();
    if (!raw) return;
    const tokens = raw.split(/\s+/);
    if (tokens.length < 2) return;
    const item = tokens[tokens.length - 1];
    const m = tokens[tokens.length - 2].match(/^(-?)(\d+)$/);
    if (!m) return;
    const type = m[1] === "-" ? "out" : "in";
    const amount = Number(m[2]);
    const memo = tokens.slice(0, tokens.length - 2).join(" ");
    addTransaction(item, type, amount, memo, todayISO());
    input.value = "";
  }

  function buildMonthGroups(name) {
    const it = getItem(name);
    const list = state.transactions
      .filter((t) => t.item === name)
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.createdAt - b.createdAt));
    let running = it ? (it.initialBalance || 0) : 0;
    const groups = [];
    let currentKey = null, currentGroup = null;
    for (const t of list) {
      const delta = t.type === "in" ? t.amount : t.type === "out" ? -t.amount : t.amount;
      const mk = t.date.slice(0, 7);
      if (mk !== currentKey) {
        currentGroup = { month: mk, opening: running, txs: [] };
        groups.push(currentGroup);
        currentKey = mk;
      }
      running += delta;
      currentGroup.txs.push({ ...t, balanceAfter: running });
    }
    groups.reverse();
    groups.forEach((g) => g.txs.reverse());
    return groups;
  }

  function buildSingleMonthGroup(name, monthKey) {
    const it = getItem(name);
    const list = state.transactions
      .filter((t) => t.item === name)
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.createdAt - b.createdAt));
    let running = it ? (it.initialBalance || 0) : 0;
    let opening = running;
    const txs = [];
    for (const t of list) {
      const delta = t.type === "in" ? t.amount : t.type === "out" ? -t.amount : t.amount;
      const mk = t.date.slice(0, 7);
      if (mk < monthKey) {
        running += delta;
        opening = running;
      } else if (mk === monthKey) {
        running += delta;
        txs.push({ ...t, balanceAfter: running });
      }
    }
    txs.reverse();
    return { month: monthKey, opening, txs };
  }

  function polarXY(cx, cy, r, deg) {
    const rad = (deg * Math.PI) / 180;
    return { x: cx + r * Math.sin(rad), y: cy - r * Math.cos(rad) };
  }
  function donutSegmentPath(cx, cy, rOuter, rInner, startDeg, endDeg) {
    const large = endDeg - startDeg > 180 ? 1 : 0;
    const p1 = polarXY(cx, cy, rOuter, startDeg);
    const p2 = polarXY(cx, cy, rOuter, endDeg);
    const p3 = polarXY(cx, cy, rInner, endDeg);
    const p4 = polarXY(cx, cy, rInner, startDeg);
    return "M " + p1.x + " " + p1.y +
      " A " + rOuter + " " + rOuter + " 0 " + large + " 1 " + p2.x + " " + p2.y +
      " L " + p3.x + " " + p3.y +
      " A " + rInner + " " + rInner + " 0 " + large + " 0 " + p4.x + " " + p4.y + " Z";
  }

  function renderItemBreakdown(elId, type, titleId, txList) {
    const el = document.getElementById(elId);
    if (!el) return;
    const titleEl = titleId ? document.getElementById(titleId) : null;
    const source = txList || state.transactions;
    const map = {};
    for (const t of source) {
      if (t.type !== type) continue;
      map[t.item] = (map[t.item] || 0) + t.amount;
    }
    const entries = Object.entries(map).filter(([, amt]) => amt > 0).sort((a, b) => b[1] - a[1]);
    const total = entries.reduce((s, [, amt]) => s + amt, 0);
    if (total === 0) {
      el.innerHTML = "";
      if (titleEl) titleEl.classList.add("hidden");
      return;
    }
    if (titleEl) titleEl.classList.remove("hidden");

    const cx = 150, cy = 60, rOuter = 38, rInner = 22;
    let cursor = 0;
    const segs = entries.map(([name, amt]) => {
      const pctNum = (amt / total) * 100;
      const deg = (amt / total) * 360;
      const start = cursor;
      const end = cursor + deg;
      const midDeg = start + deg / 2;
      cursor = end;
      const it = getItem(name);
      const color = it ? it.color : "#8A7C52";
      const anchor = polarXY(cx, cy, rOuter, midDeg);
      const side = Math.sin((midDeg * Math.PI) / 180) >= 0 ? "right" : "left";
      return { name, pctNum, color, path: donutSegmentPath(cx, cy, rOuter, rInner, start, end), anchor, side };
    });

    const leftSegs = segs.filter((s) => s.side === "left");
    const rightSegs = segs.filter((s) => s.side === "right");
    function assignLabelY(list) {
      const n = list.length;
      const spacing = Math.min(18, 84 / Math.max(n, 1));
      const startY = cy - ((n - 1) * spacing) / 2;
      list
        .slice()
        .sort((a, b) => a.anchor.y - b.anchor.y)
        .forEach((s, i) => { s.labelY = startY + i * spacing; });
    }
    assignLabelY(leftSegs);
    assignLabelY(rightSegs);

    const pathsSvg = segs.map((s) => '<path d="' + s.path + '" fill="' + s.color + '"></path>').join("");
    const labelsSvg = segs.map((s) => {
      const labelX = s.side === "left" ? cx - rOuter - 10 : cx + rOuter + 10;
      const textAnchor = s.side === "left" ? "end" : "start";
      const text = esc(s.name) + " " + formatPct(s.pctNum);
      return (
        '<text x="' + labelX + '" y="' + s.labelY + '" text-anchor="' + textAnchor +
        '" dominant-baseline="middle" font-size="9" font-weight="700" fill="' + s.color + '">' + text + '</text>'
      );
    }).join("");

    el.innerHTML =
      '<svg viewBox="0 0 300 120" class="lg-donut-svg" xmlns="http://www.w3.org/2000/svg">' +
      pathsSvg + labelsSvg +
      '</svg>';
  }

    if (state.items.length === 0) {
      listEl.innerHTML = '<div class="lg-empty">아직 항목이 없어요. "항목 관리"에서 첫 항목을 추가해보세요.</div>';
    } else {
      listEl.innerHTML = state.items.map((it) => {
        const item = it.name;
        const bal = currentBalance(item);
        const isOpen = openItem === item;
        const itemSelMonth = itemHistoryMonth[item] || todayISO().slice(0, 7);
        const itemShowAll = !!itemHistoryShowAll[item];
        const groups = itemShowAll ? buildMonthGroups(item) : [buildSingleMonthGroup(item, itemSelMonth)];

        const historyHtml = (itemShowAll && groups.length === 0)
          ? '<div class="lg-empty-tx">아직 기록이 없어요.</div>'
          : groups.map((g) => {
              const txHtml = g.txs.map((t) => {
                const isPos = t.type === "adjust" ? t.amount >= 0 : t.type === "in";
                if (editingTxId === t.id) {
                  return '<div class="lg-tx-item lg-tx-edit-row">' +
                    '<div class="lg-tx-edit-fields">' +
                      '<input type="date" class="lg-tx-edit-input" data-tx="' + t.id + '" id="edit-date-' + t.id + '" value="' + t.date + '" />' +
                      '<input type="number" inputmode="numeric" class="lg-tx-edit-input" data-tx="' + t.id + '" id="edit-amt-' + t.id + '" value="' + (t.type === "out" ? "-" : "") + Math.abs(t.amount) + '" />' +

                      '<button class="cancel" data-canceltx="' + t.id + '">취소</button>' +
                    '</div>' +

                }
                return '<div class="lg-tx-item">' +
                  '<div class="lg-tx-left"><span class="lg-tx-date">' + formatDateLabel(t.date) + '</span>' +
                  (t.memo ? '<span class="lg-tx-memo">' + esc(t.memo) + '</span>' : '') + '</div>' +
                  '<div class="lg-tx-right"><span class="lg-tx-amount ' + t.type + '">' +
                  (isPos ? "+" : "-") + formatWon(Math.abs(t.amount)) + '</span>' +
                  '<button class="lg-edit-tx" data-edittx="' + t.id + '">수정</button>' +
                  '<button class="lg-delete" data-del="' + t.id + '">×</button></div></div>';
              }).join("") || '<div class="lg-empty-tx">이 달 기록이 없어요.</div>';
              return '<div class="lg-month-group"><div class="lg-month-header">' + formatMonthLabel(g.month) +
                ' · 이월 ' + formatWon(g.opening) + '</div>' + txHtml + '</div>';
            }).join("");

        return '<div class="lg-item-card' + (isOpen ? ' open' : '') + '" data-item="' + esc(item) + '">' +
          '<div class="lg-item-head" data-toggle="' + esc(item) + '">' +
            '<div class="lg-item-name-row"><span class="lg-item-dot" style="background:' + it.color + '"></span>' +
            '<span class="lg-item-name">' + esc(item) + '</span></div>' +
            '<span class="lg-item-balance' + (bal < 0 ? ' negative' : '') + '">' + formatWon(bal) + '</span>' +
          '</div>' +
          '<div class="lg-item-body">' +
            '<div class="lg-hist-month-nav lg-item-month-nav">' +
              '<button class="lg-hist-nav-btn" data-itemprevmonth="' + esc(item) + '"' + (itemShowAll ? ' disabled' : '') + '>‹</button>' +
              '<span class="lg-hist-month-label">' + (itemShowAll ? "전체 보는 중" : formatMonthLabel(itemSelMonth)) + '</span>' +
              '<button class="lg-hist-nav-btn" data-itemnextmonth="' + esc(item) + '"' + (itemShowAll ? ' disabled' : '') + '>›</button>' +
              '<button class="lg-hist-all-btn' + (itemShowAll ? ' active' : '') + '" data-itemalltoggle="' + esc(item) + '">' + (itemShowAll ? "월별로 보기" : "전체보기") + '</button>' +
            '</div>' +
            '<div class="lg-history-label">거래 내역</div>' +
            historyHtml +
          '</div>' +
        '</div>';
      }).join("");
    }

    // 월 탐색 UI 갱신
    const monthLabelEl = document.getElementById("histMonthLabel");
    const allToggleBtn = document.getElementById("histAllToggle");
    const sectionTitleEl = document.getElementById("histSectionTitle");
    if (monthLabelEl) monthLabelEl.textContent = historyShowAll ? "전체 보는 중" : formatMonthLabel(historyMonth);
    if (allToggleBtn) {
      allToggleBtn.classList.toggle("active", historyShowAll);
      allToggleBtn.textContent = historyShowAll ? "월별로 보기" : "전체보기";
    }
    if (sectionTitleEl) sectionTitleEl.textContent = historyShowAll ? "전체 내역" : formatMonthLabel(historyMonth) + " 내역";
    const prevBtnEl = document.getElementById("histPrevMonth");
    const nextBtnEl = document.getElementById("histNextMonth");
    if (prevBtnEl) prevBtnEl.disabled = historyShowAll;
    if (nextBtnEl) nextBtnEl.disabled = historyShowAll;

    const all = (historyShowAll ? [...state.transactions] : state.transactions.filter((t) => t.date.slice(0, 7) === historyMonth))
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt));
    const totalIn = all.filter((t) => t.type === "in").reduce((s, t) => s + t.amount, 0);
    const totalOut = all.filter((t) => t.type === "out").reduce((s, t) => s + t.amount, 0);
    document.getElementById("totalIn").textContent = formatWon(totalIn);
    document.getElementById("totalOut").textContent = formatWon(totalOut);
    const netEl = document.getElementById("netChange");
    netEl.textContent = formatWon(totalIn - totalOut);
    netEl.className = "lg-stamp-value " + (totalIn - totalOut < 0 ? "expense" : "income");

    const chartEl = document.getElementById("ratioChart");
    const chartTotal = totalIn + totalOut;
    if (chartTotal === 0) {
      chartEl.innerHTML = "";
    } else {
      const inPctNum = (totalIn / chartTotal) * 100;
      const outPctNum = 100 - inPctNum;
      const inDeg = (inPctNum / 100) * 360;
      chartEl.innerHTML =
        '<div class="lg-ratio-donut" style="background: conic-gradient(var(--green-ink) 0deg ' + inDeg + 'deg, var(--red-ink) ' + inDeg + 'deg 360deg);"></div>' +
        '<div class="lg-ratio-legend">' +
          '<div class="lg-ratio-legend-row"><span class="lg-ratio-dot" style="background: var(--green-ink);"></span><span>입금</span><span class="lg-ratio-pct income">' + formatPct(inPctNum) + '</span></div>' +
          '<div class="lg-ratio-legend-row"><span class="lg-ratio-dot" style="background: var(--red-ink);"></span><span>출금</span><span class="lg-ratio-pct expense">' + formatPct(outPctNum) + '</span></div>' +
        '</div>';
    }

    renderItemBreakdown("incomeByItemChart", "in", "incomeByItemTitle", all);
    renderItemBreakdown("expenseByItemChart", "out", "expenseByItemTitle", all);

    const histEl = document.getElementById("allHistory");
    if (all.length === 0) {
      histEl.innerHTML = '<div class="lg-empty">아직 기록이 없어요.</div>';
    } else {
      const colorMap = {};
      state.items.forEach((i) => (colorMap[i.name] = i.color));
      histEl.innerHTML = '<table class="lg-table"><colgroup><col class="col-date"><col class="col-item"><col class="col-type"><col class="col-amount"><col class="col-memo"></colgroup><thead><tr><th>날짜</th><th>항목</th><th>구분</th><th>금액</th><th>내용</th></tr></thead><tbody>' +
        all.map((t) => {
          const isPos = t.type === "adjust" ? t.amount >= 0 : t.type === "in";
          const typeLabel = t.type === "in" ? "입금" : t.type === "out" ? "출금" : "설정";
          return '<tr><td>' + formatDateLabel(t.date) + '</td>' +
            '<td><span class="lg-table-tag" style="background:' + (colorMap[t.item] || "#8A7C52") + '">' + esc(t.item) + '</span></td>' +
            '<td>' + typeLabel + '</td>' +
            '<td class="lg-table-amount ' + (isPos ? "in" : "out") + '">' + (isPos ? "+" : "-") + formatWon(Math.abs(t.amount)) + '</td>' +
            '<td class="lg-table-memo">' + esc(t.memo) + '</td></tr>';
        }).join("") + '</tbody></table>';
    }

    attachEvents();
  }

  function attachEvents() {
    document.querySelectorAll("[data-toggle]").forEach((el) => {
      el.onclick = () => { const item = el.getAttribute("data-toggle"); openItem = openItem === item ? null : item; editingTxId = null; render(); };
    });
    document.querySelectorAll("[data-edittx]").forEach((el) => {
      el.onclick = (e) => { e.stopPropagation(); editingTxId = el.getAttribute("data-edittx"); render(); };
    });
    document.querySelectorAll("[data-canceltx]").forEach((el) => {
      el.onclick = (e) => { e.stopPropagation(); editingTxId = null; render(); };
    });
    document.querySelectorAll("[data-savetx]").forEach((el) => {
      el.onclick = (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-savetx");
        const date = document.getElementById("edit-date-" + id).value;
        const rawAmt = document.getElementById("edit-amt-" + id).value.trim();
        const memo = document.getElementById("edit-memo-" + id).value;
        const amt = Number(rawAmt);
        if (Number.isNaN(amt)) return;
        const newType = rawAmt.startsWith("-") ? "out" : "in";
        editTransaction(id, date, Math.abs(amt), memo, newType);
      };
    });
    document.querySelectorAll(".lg-tx-edit-input").forEach((el) => {
      el.onkeydown = (e) => {
        if (e.key === "Enter") {
          e.stopPropagation();
          const id = el.getAttribute("data-tx");
          const btn = document.querySelector('[data-savetx="' + id + '"]');
          if (btn) btn.click();
        }
      };
    });
    document.querySelectorAll("[data-del]").forEach((el) => {
      el.onclick = (e) => { e.stopPropagation(); deleteTransaction(el.getAttribute("data-del")); };
    });
    document.querySelectorAll("[data-remove]").forEach((el) => {
      el.onclick = () => { if (confirm(el.getAttribute("data-remove") + " 항목을 삭제할까요? 관련 거래 내역도 함께 삭제돼요.")) removeItem(el.getAttribute("data-remove")); };
    });
    document.querySelectorAll("[data-itemprevmonth]").forEach((el) => {
      el.onclick = (e) => {
        e.stopPropagation();
        const item = el.getAttribute("data-itemprevmonth");
        const cur = itemHistoryMonth[item] || todayISO().slice(0, 7);
        itemHistoryMonth[item] = shiftMonth(cur, -1);
        itemHistoryShowAll[item] = false;
        openItem = item;
        render();
      };
    });
    document.querySelectorAll("[data-itemnextmonth]").forEach((el) => {
      el.onclick = (e) => {
        e.stopPropagation();
        const item = el.getAttribute("data-itemnextmonth");
        const cur = itemHistoryMonth[item] || todayISO().slice(0, 7);
        itemHistoryMonth[item] = shiftMonth(cur, 1);
        itemHistoryShowAll[item] = false;
        openItem = item;
        render();
      };
    });
    document.querySelectorAll("[data-itemalltoggle]").forEach((el) => {
      el.onclick = (e) => {
        e.stopPropagation();
        const item = el.getAttribute("data-itemalltoggle");
        itemHistoryShowAll[item] = !itemHistoryShowAll[item];
        openItem = item;
        render();
      };
    });
    document.querySelectorAll("[data-editname]").forEach((el) => {
      el.onclick = () => { editingItemName = el.getAttribute("data-editname"); render(); };
    });
    document.querySelectorAll("[data-cancelrename]").forEach((el) => {
      el.onclick = () => { editingItemName = null; render(); };
    });
    document.querySelectorAll("[data-saverename]").forEach((el) => {
      el.onclick = () => {
        const oldName = el.getAttribute("data-saverename");
        const input = document.getElementById("rename-" + oldName);
        if (renameItem(oldName, input.value)) {
          editingItemName = null;
          render();
        }
      };
    });
    document.querySelectorAll(".lg-manage-rename-input").forEach((el) => {
      el.onkeydown = (e) => {
        if (e.key === "Enter") {
          const oldName = el.id.replace("rename-", "");
          const btn = document.querySelector('[data-saverename="' + oldName + '"]');
          if (btn) btn.click();
        }
      };
    });
  }

  document.getElementById("quickBtn").onclick = handleQuickAdd;
  document.getElementById("quickInput").addEventListener("keydown", (e) => { if (e.key === "Enter") handleQuickAdd(); });

  document.getElementById("manageToggle").onclick = () => {
    document.getElementById("manageBody").classList.toggle("show");
    document.getElementById("manageChevron").classList.toggle("open");
  };
  document.getElementById("addItemBtn").onclick = () => {
    const nameEl = document.getElementById("newItemName");
    const balEl = document.getElementById("newItemBalance");
    const ok = addItem(nameEl.value, Number(balEl.value) || 0);
    if (ok) { nameEl.value = ""; balEl.value = ""; render(); }
  };
  document.getElementById("newItemName").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("addItemBtn").click(); });
  document.getElementById("newItemBalance").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("addItemBtn").click(); });

  document.getElementById("saveBtn").onclick = () => saveState();

  document.querySelectorAll(".lg-tab-btn").forEach((btn) => {
    btn.onclick = () => {
      activeTab = btn.getAttribute("data-tab");
      document.querySelectorAll(".lg-tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
      document.getElementById("tabPanelItems").classList.toggle("active", activeTab === "items");
      document.getElementById("tabPanelHistory").classList.toggle("active", activeTab === "history");
    };
  });

  document.getElementById("histPrevMonth").onclick = () => {
    historyShowAll = false;
    historyMonth = shiftMonth(historyMonth, -1);
    render();
  };
  document.getElementById("histNextMonth").onclick = () => {
    historyShowAll = false;
    historyMonth = shiftMonth(historyMonth, 1);
    render();
  };
  document.getElementById("histAllToggle").onclick = () => {
    historyShowAll = !historyShowAll;
    render();
  };

  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById("installBanner").classList.add("show"); });
  document.getElementById("installBtn").onclick = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById("installBanner").classList.remove("show");
  };

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
  }

  // 오프라인 중에 저장된 내용을 온라인 복귀 시 클라우드에 다시 반영
  window.addEventListener("online", () => {
    if (currentUser && firebaseReady && window.__lgSaveCloud) {
      window.__lgSaveCloud(state);
    }
  });

  renderAccountPanel();
  render();
  initFirebase();
</script>
</body>
</html>
